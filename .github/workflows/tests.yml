# Peanut Booker — PHP test + security nets (Testing Protocol v2)
#
# Net 2 (security): composer audit, BLOCKING as of 2026-08-20.
# Net 6 (property): the pure-function property suite (tests/Property), no WP runtime.
# Security core: current-contract tests over encryption, rate limiting, and roles;
# blocking at 30% scoped production coverage.
#
# The legacy WP-mocked Unit suite (tests/phpunit/unit) is run non-blocking: it has
# pre-existing drift from the code under newer PHP and is tracked separately. The
# property and security-core suites are the enforced test gates here.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Public host floor. The locked PHPUnit graph begins at PHP 8.1, so this job
  # proves the exact PHP 8.0 parser and declarations without resolving dev tools.
  php-runtime-minimum:
    name: PHP 8.0 runtime declarations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.0"
          coverage: none
      - name: Verify PHP 8.0 runtime declarations
        run: php scripts/verify-php-runtime.php --expect-runtime=8.0
      - name: Parse every tracked PHP file on PHP 8.0
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  php-development-minimum:
    name: Property tests (PHP 8.1 development minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.1"
          coverage: none
          tools: composer
      - name: Install locked dependencies at the development floor
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP 8.1 development declarations
        run: php scripts/verify-php-runtime.php --expect-development-runtime=8.1
      - name: Property suite (pure functions, no WordPress)
        run: vendor/bin/phpunit -c phpunit.property.xml
      - name: Legacy unit suite (non-blocking — pre-existing drift, tracked)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

  security-core:
    name: Security core contract and coverage
    runs-on: ubuntu-latest
    env:
      MIN_COVERAGE: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Security core tests with scoped production coverage
        run: vendor/bin/phpunit -c phpunit.security-core.xml
      - name: Enforce the reviewed security-core floor
        run: php coverage-gate.php tests/coverage/security-core-clover.xml "$MIN_COVERAGE"
      - name: Upload security-core coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-core-coverage
          path: tests/coverage/security-core-*

  security:
    name: Dependency audit (net 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate Composer audit transport contract
        run: |
          bash scripts/tests/composer-audit-transport.test.sh
          bash scripts/tests/composer-npm-audit-workflow.test.sh
      - name: Composer audit (blocking)
        run: bash scripts/run-dependency-audit-transport.sh composer

  property:
    name: Property tests (PHP 8.3 current)
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Property suite (pure functions, no WordPress)
        run: vendor/bin/phpunit -c phpunit.property.xml

      - name: Legacy unit suite (non-blocking — pre-existing drift, tracked)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=Unit --no-coverage

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh peanut-booker
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer
      - name: Reject Git metadata in release artifacts
        run: bash tests/release-artifact.test.sh
      - name: Build and inspect an unsigned production artifact
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-source --optimize-autoloader --no-interaction
          source .peanut/release/plugin-release-config.sh
          peanut_release_config peanut-booker
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          mkdir -p "$stage/peanut-booker"
          for item in "${INCLUDE[@]}"; do cp -a "$item" "$stage/peanut-booker/"; done
          bash .peanut/release/package-plugin-artifact.sh "$stage" peanut-booker "$stage/release.zip"
          unzip -q "$stage/release.zip" -d "$stage/extracted"
          php -r 'define("ABSPATH", "/tmp/"); require $argv[1]; exit(class_exists("Peanut\\FormCore\\Update\\SignedUpdateGate") ? 0 : 1);' "$stage/extracted/peanut-booker/vendor/autoload.php"
