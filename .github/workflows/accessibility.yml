name: Accessibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate npm audit transport contract
        run: bash ../scripts/tests/npm-audit-transport.test.sh

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies at the fleet moderate floor
        run: bash ../scripts/run-dependency-audit-transport.sh npm

      - name: ESLint with jsx-a11y
        continue-on-error: true
        run: npm run lint:a11y

      - name: Run accessibility tests
        run: npm run test:a11y
