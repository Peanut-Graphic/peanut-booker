schema_version: 1
project:
  id: peanut-booker
  name: Peanut Booker
  classification: distributed-plugin
  repository: https://github.com/Peanut-Graphic/peanut-booker.git
  lifecycle: maintenance
ownership:
  platform: Peanut Graphic
  deployment: Peanut Graphic
  rollback: Peanut Graphic
environments:
  - name: distribution
    kind: production
    provider: GitHub Releases and Peanut License Server
    url: "https://github.com/Peanut-Graphic/peanut-booker/releases"
  - name: central-first-party-install
    kind: production
    provider: peanutgraphic.com shared WordPress hosting
    url: "https://peanutgraphic.com"
runtimes:
  - name: php
    baseline: WordPress compatibility matrix
    declarations:
      - { scope: dependency, source: peanut-booker.php, value: "Requires PHP 8.0" }
      - { scope: dependency, source: composer.json and composer.lock, value: "runtime require >=8.0; locked development resolver platform 8.1.0 for PHPUnit dependencies" }
      - { scope: ci, source: .github/workflows/tests.yml and wp-contract.yml, value: "required exact PHP 8.0 parser/declaration, exact PHP 8.1 property, PHP 8.3 current property, and PHP 8.3 real WordPress/MySQL" }
    production_observation: { status: verified, value: "PHP 8.5.9 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only host interpreter and active-plugin inventory" }
  - name: node
    baseline: "22"
    declarations:
      - { scope: dependency, source: README.md, value: "Node.js 18+" }
      - { scope: dependency, source: frontend/package.json, value: "engines and packageManager missing; version 1.7.2" }
      - { scope: ci, source: .github/workflows/accessibility.yml, value: "Node 20" }
    production_observation: { status: not-applicable }
  - name: wordpress
    baseline: WordPress 6.0+ with WooCommerce 8.0+
    declarations:
      - { scope: dependency, source: peanut-booker.php, value: "Requires WordPress 6.0, PHP 8.0, and WooCommerce 8.0" }
      - { scope: test, source: .github/workflows/wp-contract.yml, value: "WordPress latest on MySQL 8; WooCommerce is not installed in the contract lane" }
    production_observation: { status: verified, value: "WordPress 6.9.7 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only WP-CLI core-version and active-plugin inventory" }
databases:
  - name: host-database
    role: transactional
    baseline: Host MySQL 5.7+ or MariaDB 10.3+
    declarations:
      - { scope: documentation, source: README.md, value: "MySQL 5.7+ or MariaDB 10.3+" }
      - { scope: dependency, source: includes/class-activator.php and includes/class-database.php, value: "eleven dbDelta tables plus a versioned ALTER TABLE migration during normal plugin boot" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "mysql:8 compatibility and mariadb:10.6 production-family real WordPress contract lanes; the declared MySQL 5.7 and MariaDB 10.3 minimums remain unexercised" }
    production_equivalent_test: "yes"
    production_observation: { status: verified, value: "MariaDB 10.6.27, latin1_swedish_ci server collation, SQL mode ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only database metadata query; no application rows read" }
services:
  - kind: scheduler
    baseline: WordPress cron on each plugin installation
    declarations:
      - { scope: dependency, source: includes/class-booking.php and includes/class-market.php, value: "daily escrow-release and reminder jobs plus hourly bid-deadline checks" }
      - { scope: dependency, source: includes/class-peanut-booker.php, value: "weekly local ML-model training" }
    production_observation: { status: verified, value: "Hourly bid-deadline and daily escrow/reminder hooks registered centrally; weekly ML-training hook absent", observed_at: "2026-08-15T01:23:00-04:00", evidence: "read-only WP-Cron schedule metadata; no event executed" }
  - kind: other
    baseline: WooCommerce and optional WooCommerce Subscriptions on each plugin installation
    declarations:
      - { scope: dependency, source: peanut-booker.php and includes/class-woocommerce.php, value: "WooCommerce is a hard boot dependency and owns order, deposit, refund, escrow, and payment-gateway behavior" }
      - { scope: dependency, source: includes/class-subscriptions.php, value: "optional WooCommerce Subscriptions events mutate Booker membership state" }
    production_observation: { status: verified, value: "Peanut Booker is active but WooCommerce and WooCommerce Subscriptions are not active on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only active-plugin slug inventory" }
  - kind: other
    baseline: Optional operator-configured integrations
    declarations:
      - { scope: dependency, source: includes/class-google-auth.php, value: "Google OAuth identity endpoints use per-install client credentials; documented calendar synchronization is not implemented by this class" }
      - { scope: dependency, source: includes/class-ml-booking-predictor.php, value: "fixed http://127.0.0.1:8100 ML health, prediction, and training API" }
    production_observation: { status: verified, value: "Central host loopback ML /health reports peanut-ml 1.0.0 healthy; Google OAuth configuration and distributed client integrations unverified", observed_at: "2026-08-15T01:23:00-04:00", evidence: "read-only loopback health request; no model training or identity flow invoked" }
  - kind: other
    baseline: Peanut License Server update and license API
    declarations:
      - { scope: dependency, source: peanut-booker.php and includes/class-peanut-license-client.php, value: "defaults to https://peanutgraphic.com/wp-json/peanut-api/v1 for license validation and WordPress update metadata" }
    production_observation: { status: not-applicable }
distribution:
  mode: manual
  source_of_truth: Historical manually packaged GitHub Release v1.7.2 and live Peanut License Server metadata
  versioned_artifact: "yes"
  signed: "no"
  canary: unknown
  rollback: unknown
exceptions:
  - id: PAR-207
    concern: JavaScript runtime declarations remain below the fleet baseline
    reason: PAR-207 reconciles the PHP 8.0 host floor, PHP 8.1 locked development floor, exact-minimum required CI, current/real-WordPress PHP 8.3, and observed central PHP 8.5.9; README permits Node 18+, frontend CI uses Node 20, GitHub actions execute on Node 24, the fleet baseline is Node 22, and frontend/package.json declares neither engines.node nor packageManager.
    risk: Local frontend builds, CI, and release assets can exercise materially different Node/npm versions.
    owner: Peanut Graphic
    verification: Pin fleet Node and npm versions and execute the frontend gates on the declared versions.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-306
    concern: The declared MySQL 5.7 and MariaDB 10.3 minimums are still unexercised, and client hosts remain unverified
    reason: Real WordPress contracts now run on MySQL 8 and the central installation's MariaDB 10.6 family, covering the eleven dbDelta tables and the hand-written SHOW and ALTER TABLE migration queries this plugin runs during ordinary plugin boot. Two gaps are unchanged by that. The plugin declares MySQL 5.7+ and MariaDB 10.3+, so both declared floors sit below every lane that runs, and distributed client-host versions, collations, SQL modes, and upgrade histories remain unknown.
    risk: Schema or migration behavior specific to an older declared engine, or to a client-specific collation or SQL mode, can still fail on Booker sites without appearing in the required gate.
    owner: Peanut Graphic
    verification: Keep both lanes green; then either cover the declared MySQL 5.7 and MariaDB 10.3 floors or raise the declared minimums to what CI proves.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-310
    concern: Install-specific payment, identity, subscription, and local ML production boundaries are unverified
    reason: Booker depends on WooCommerce for order, refund, deposit, escrow, and payment-gateway behavior; optionally mutates membership from WooCommerce Subscriptions, uses operator-owned Google OAuth credentials, and calls a fixed localhost ML service. The central installation has Booker active without WooCommerce, exposes a healthy peanut-ml 1.0.0 loopback service, registers three operational hooks but not weekly ML training, and leaves client installations, Google OAuth, payment, backup, and rollback state unverified.
    risk: Plugin releases and external service configuration can drift independently around financial, identity, and prediction workflows without a single auditable release or rollback contract.
    owner: Peanut Graphic
    verification: Inventory active installations and integration owners, test payment/subscription and OAuth failure paths, identify the ML service revision, and document backup and rollback boundaries.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-402
    concern: Peanut Booker is absent from the canonical signed publisher
    reason: Peanut Meta publish-plugin.sh has no peanut-booker case, while the latest v1.7.2 release is an unsigned standalone ZIP with no manifest or canary evidence and its tag is 34 commits behind main.
    risk: Maintained source cannot produce an authenticated current release through the fleet's authoritative WordPress publishing contract.
    owner: Peanut Graphic
    verification: Add a curated Booker package contract to the central publisher, dry-run it, ship an approved signed release, and prove its active canary and rollback behavior.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-405
    concern: Release contents, advertised metadata, source revision, and rollback evidence drift
    reason: The v1.7.2 ZIP contains 192 entries including PHPUnit suites, frontend source, configuration, and generated coverage reports; current main is 34 commits ahead; and the live Booker update response serves Peanut Suite description, installation, FAQ, and changelog content. No rollback evidence was found.
    risk: Customers receive unnecessary development artifacts and incorrect product information, maintained fixes remain unreleased, and an incident has no source-verifiable rollback control.
    owner: Peanut Graphic
    verification: Define and test a curated required-file contract, source Booker-specific update metadata, release the intended audited revision through the signed publisher, and prove rollback.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-407
    concern: Peanut Booker updates are not authenticated by a package-signature gate
    reason: The live license server advertises a direct unsigned GitHub ZIP, the release has no signature manifest, and source inspection found no upgrader_pre_download or equivalent checksum/signature verification hook.
    risk: Installed Booker copies cannot reject a tampered, substituted, or incomplete update package before WordPress installs it.
    owner: Peanut Graphic
    verification: Add and test a fail-closed updater that accepts the signed official artifact and rejects missing or invalid signatures and incomplete packages.
    review_date: "2026-11-14"
    status: proposed
  - id: PAR-507
    concern: GitHub repository archive conflicted with maintenance and release-parity scope
    reason: Peanut-Graphic/peanut-booker was archived and read-only while the parity registry marked it maintenance lifecycle, program-scope active, and manifest-required; the user explicitly approved unarchiving solely to restore the manifest review workflow, and GitHub now reports archived=false.
    risk: The archive had blocked required manifests, fixes, and central-publisher onboarding while the live license server continued to advertise the plugin.
    owner: Peanut Graphic
    verification: User approval is recorded in the parity tracker and an independent GitHub repository read confirms archived=false before commit and push.
    review_date: "2026-08-14"
    status: retired
  - id: PAR-503
    concern: Required pull-request workflows previously had no eligible runner for this public repository
    reason: PAR-207 restores all three test-only workflows to ubuntu-latest after the organization self-hosted runner group rejected this public repository. No runner-group or external account setting changes.
    risk: Resolved in source; future runner-label drift could again suppress fresh server-side verification.
    owner: Peanut Graphic
    verification: Require the applicable hosted contexts on main and retain a fail-closed workflow declaration contract.
    review_date: "2026-08-21"
    status: retired
  - id: PAR-505
    concern: Frontend dependency security baseline required continuous enforcement
    reason: The repaired lock and current Dependabot feed report zero vulnerabilities. The accessibility workflow now performs a clean locked install and fails on moderate-or-higher production advisories on pull requests and exact main before executing its frontend gates.
    risk: Retired; a new moderate production advisory now fails the owning frontend workflow instead of relying on periodic reporting.
    owner: Peanut Graphic
    verification: Keep the blocking moderate production audit and Dependabot feed green; handle any new advisory through an exact, time-bounded ADV exception rather than weakening the fleet floor.
    review_date: "2026-08-22"
    status: retired
verification:
  status: live-verified
  audited_commit: 67be825c16c504d7a6a4374de732d31521398b37
  last_reviewed: "2026-08-23"
  sources:
    - peanut-booker.php
    - composer.json
    - README.md
    - frontend/package.json
    - includes/class-activator.php
    - includes/class-database.php
    - includes/class-booking.php
    - includes/class-market.php
    - includes/class-peanut-booker.php
    - includes/class-woocommerce.php
    - includes/class-subscriptions.php
    - includes/class-google-auth.php
    - includes/class-ml-booking-predictor.php
    - includes/class-peanut-license-client.php
    - .github/workflows/tests.yml
    - .github/workflows/accessibility.yml
    - .github/workflows/dependency-audit.yml
    - requirements-dependency-audit.txt
    - requirements-dependency-audit.lock
    - .peanut/platform/requirements.lock
    - .github/workflows/wp-contract.yml
    - scripts/verify-php-runtime.php
    - Peanut-Graphic/peanut-meta:scripts/publish-plugin.sh
    - GitHub Release v1.7.2 ZIP metadata and contents
    - Peanut License Server /updates/check response for peanut-booker
    - GitHub repository archived-state response
    - GitHub Actions permissions, organization runner inventory, and Default runner-group policy
    - Read-only central first-party PHP, WordPress, active-plugin, WP-Cron, loopback ML health, MariaDB version, collation, and SQL-mode metadata on 2026-08-15
  outstanding:
    - Inventory supported distributed client-host PHP, WordPress, database, WooCommerce/payment, Google OAuth, scheduler, and ML contracts without collecting customer data.
    - Reconcile why Booker is active centrally without its declared hard WooCommerce dependency and why weekly ML training is not registered.
    - Align and pin Node and npm declarations under PAR-205.
    - Keep the blocking moderate frontend dependency audit and current zero-vulnerability baseline green under PAR-508/PAR-505.
    - Cover the declared MySQL 5.7 and MariaDB 10.3 floors, or raise the declared minimums to what CI proves, under PAR-306.
    - Keep Composer, the frontend production lock, the hash-locked auditor, and the platform-validator lock blocking-audited under PAR-508; all four surfaces are zero-finding at this review.
    - Decide the WooCommerce dependency's future, given the owner reports WooCommerce is not in use. Booker boots only when it is present, so on such a site the plugin registers nothing beyond an admin notice.
    - Inventory install-specific external services under PAR-310.
    - Add Booker to the signed publisher, fix update metadata, authenticate packages, curate release contents, and prove canary and rollback under PAR-402, PAR-405, and PAR-407.
